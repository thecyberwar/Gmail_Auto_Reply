<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SUBJECT}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f8; font-family:Arial, Helvetica, sans-serif;">

  <!-- Wrapper -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f8; padding:24px 8px;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px; width:100%; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #e4e7ec;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1a73e8; padding:26px 32px;">
              <p style="margin:0; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#cfe0ff;">
                {{APP_NAME}}
              </p>
              <h1 style="margin:8px 0 0; font-size:24px; line-height:1.3; color:#ffffff;">
                Auto Reply
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px 32px 10px 32px;">
              <p style="margin:0 0 16px 0; font-size:16px; color:#101828;">
                Hi <strong>{{SENDER_NAME}}</strong>,
              </p>

              <p style="margin:0 0 16px 0; font-size:15px; line-height:1.7; color:#475467;">
                {{MESSAGE_HTML}}
              </p>

              <!-- Original email info -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="background-color:#f9fafb; border-left:4px solid #1a73e8; border-radius:6px; margin:20px 0;">
                <tr>
                  <td style="padding:14px 16px;">
                    <p style="margin:0 0 6px 0; font-size:12px; text-transform:uppercase; letter-spacing:0.8px; color:#98a2b3;">
                      Aapka email mil gaya
                    </p>
                    <p style="margin:0; font-size:14px; color:#344054;">
                      <strong>Subject:</strong> {{SUBJECT}}
                    </p>
                    <p style="margin:4px 0 0 0; font-size:13px; color:#667085;">
                      <strong>Date:</strong> {{DATE}}
                    </p>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 4px 0; font-size:15px; color:#475467;">
                Dhanyavaad,
              </p>
              <p style="margin:0; font-size:15px; color:#101828;">
                <strong>{{APP_NAME}}</strong>
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:22px 32px 0 32px;">
              <hr style="border:none; border-top:1px solid #eaecf0; margin:0;">
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px 26px 32px;">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#98a2b3; text-align:center;">
                © {{YEAR}} {{APP_NAME}} · This is an automatic reply, no response is needed.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>
  <!-- /Wrapper -->

</body>
</html>
